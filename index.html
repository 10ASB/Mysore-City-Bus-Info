<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Mysuru Bus Connect</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header class="topbar">
        <a class="brand" href="#">
            🚌 Mysuru Bus Connect
        </a>

        <nav>
            <a href="#search">Find a Route</a>
            <a href="#features">Features</a>
            <a href="#about">About</a>
        </nav>
    </header>

    <main>
        <section class="hero">
            <p>YOUR CITY. YOUR ROUTE.</p>

            <h1>
                Get around
                <span>Mysuru</span>
                with confidence.
            </h1>

            <p>
                Discover city bus routes, stops,
                and travel information in Mysuru.
            </p>

            <a href="#search" class="button">
                Explore routes →
            </a>
        </section>

        <section id="search">
            <h2>Where do you want to go?</h2>

            <form id="route-form">
                <label>
                    From
                    <input id="from"
                           placeholder="Starting location"
                           required>
                </label>

                <label>
                    To
                    <input id="to"
                           placeholder="Destination"
                           required>
                </label>

                <button type="submit">
                    Find Route
                </button>
            </form>

            <div id="route-result" hidden></div>
        </section>

    </main>

    <script src="script.js"></script>

</body>
</html>
